<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seven Day Planner</title><style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#e9eef8;background:#101723;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;background:#24344b;border:1px solid #3c526c;color:#edf3fc;border-radius:8px;padding:8px 12px}button:hover{background:#314864}button.active,.primary{background:#3679d2;border-color:#4d90e9;color:white}input,select,textarea{background:#172334;border:1px solid #43536b;border-radius:7px;color:#fff;padding:9px;width:100%}label{display:block;margin:12px 0 5px;color:#b8c9df}header{padding:14px 18px;border-bottom:1px solid #2e3b50;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#151f2e}header h1{font-size:19px;margin:0 14px 0 0}.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.grow{flex:1}.subtitle{color:#a7b9d1}.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;padding:10px 14px;background:#151f2e}.days button{padding:9px 2px}.days button strong{display:block;font-size:18px;margin-top:3px}.calendar-shell{height:calc(100vh - 154px);min-height:360px;overflow:auto;position:relative;background:#121b29}.calendar{position:relative;min-width:380px}.day-head{position:sticky;top:0;z-index:8;background:#1b293b;border-bottom:1px solid #45546a;display:flex;height:38px}.time-head{width:78px;flex:none}.head-days{display:grid;flex:1}.head-days div{text-align:center;border-left:1px solid #39485d;padding:10px 2px;font-weight:600}.body-row{display:flex;position:relative}.time-axis{width:78px;flex:none;position:relative;border-right:1px solid #405068}.hour-label{position:absolute;right:10px;transform:translateY(-8px);font-size:11px;color:#9eb2cd;white-space:nowrap}.grid-area{flex:1;position:relative;display:grid}.day-column{position:relative;border-left:1px solid #344256;background:repeating-linear-gradient(to bottom,transparent 0,transparent 27px,#28364a 27px,#28364a 28px);cursor:crosshair}.day-column:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0,transparent 111px,#40516b 111px,#40516b 112px);pointer-events:none}.day-column:hover{background-color:#18263a}.event{position:absolute;left:4px;right:4px;border-radius:5px;border-left:4px solid #72b4ff;background:#234d7d;color:white;padding:5px 6px;overflow:hidden;z-index:2;cursor:pointer;font-size:12px;line-height:1.25;box-shadow:0 2px 6px #0004}.event:hover{filter:brightness(1.2)}.event .event-time{font-size:10px;opacity:.85}.event.personal{background:#315943;border-color:#7cdaa5}.event.break{background:#604b2d;border-color:#f5c36c}.event.other{background:#593c69;border-color:#d39bf1}.event.conflict{outline:2px solid #ff7c7c}.week .event{font-size:10px;padding:3px}.week .event-time{display:none}.modal-backdrop{position:fixed;inset:0;background:#050b13bd;z-index:30;display:flex;align-items:center;justify-content:center;padding:15px}.modal{background:#1b283a;border:1px solid #455a75;border-radius:13px;padding:22px;width:min(460px,100%);box-shadow:0 12px 50px #0009}.modal h2{margin:0 0 10px;font-size:20px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}.danger{background:#70313b;border-color:#9e4b58;margin-right:auto}.hidden{display:none!important}.note{font-size:12px;color:#aabbd1;margin-top:10px}.toast{position:fixed;bottom:18px;right:18px;background:#244b36;border:1px solid #528b68;padding:12px;border-radius:9px;z-index:40;display:none}@media(max-width:680px){header{padding:10px}.days{padding:6px;gap:2px}.days button{font-size:11px;padding:7px 0}.days button strong{font-size:14px}.calendar-shell{height:calc(100vh - 190px)}.time-axis,.time-head{width:62px}.hour-label{right:5px;font-size:10px}.week .calendar{min-width:800px}}@media print{header,.days,.modal-backdrop{display:none!important}.calendar-shell{height:auto;overflow:visible}.calendar{min-width:0}.event{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style></head><body><header><h1>📅 Seven Day Planner</h1><div class="toolbar"><button id="prev" title="Previous week">◀</button><button id="today">Today</button><button id="next" title="Next week">▶</button><input id="datePicker" type="date" style="width:145px"><span id="range" class="subtitle"></span></div><span class="grow"></span><div class="toolbar"><button id="dayView" class="active">Day</button><button id="weekView">Week</button><button id="add" class="primary">+ Activity</button><button id="export">Export JSON</button><button id="import">Import JSON</button><input id="fileInput" class="hidden" type="file" accept=".json,application/json"><button id="print">Print</button></div></header><nav id="days" class="days"></nav><main id="scroll" class="calendar-shell"><div id="calendar" class="calendar"></div></main><div id="modalBackdrop" class="modal-backdrop hidden"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle">Activity</h2><form id="eventForm"><label for="title">Activity name</label><input id="title" required maxlength="120" placeholder="What are you planning?"><div class="form-row"><div><label for="eventDate">Date</label><input id="eventDate" type="date" required></div><div><label for="start">Start time</label><select id="start"></select></div></div><div class="form-row"><div><label for="duration">Duration</label><select id="duration"></select></div><div><label for="category">Category</label><select id="category"><option value="work">Work</option><option value="personal">Personal</option><option value="break">Break</option><option value="other">Other</option></select></div></div><label for="notes">Notes (optional)</label><textarea id="notes" rows="3" placeholder="Details..."></textarea><div id="conflictNote" class="note"></div><div class="modal-actions"><button id="delete" class="danger hidden" type="button">Delete</button><button id="cancel" type="button">Cancel</button><button class="primary" type="submit">Save activity</button></div></form></div></div><div id="toast" class="toast"></div><script>
(()=>{'use strict';const KEY='sevenDayPlanner.v1',SLOT=28,DAY=96*SLOT,$=id=>document.getElementById(id);const pad=n=>String(n).padStart(2,'0'),localDate=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,fromDate=s=>new Date(`${s}T12:00:00`),addDays=(s,n)=>{const d=fromDate(s);d.setDate(d.getDate()+n);return localDate(d)},monday=s=>{const d=fromDate(s);return addDays(s,-(d.getDay()+6)%7)},fmt=s=>fromDate(s).toLocaleDateString(undefined,{month:'short',day:'numeric'}),minuteLabel=n=>{const h=Math.floor(n/60);return `${h%12||12}:${pad(n%60)} ${h<12?'AM':'PM'}`},id=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():`id-${Date.now()}-${Math.random().toString(36).slice(2)}`;let state={events:[],selected:localDate(new Date()),view:'day'},editing=null;try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.events)){state.events=saved.events.filter(validEvent);if(/^\d{4}-\d\d-\d\d$/.test(saved.selected))state.selected=saved.selected;if(['day','week'].includes(saved.view))state.view=saved.view}}catch(e){console.warn('Saved data could not be loaded',e)}function validEvent(e){return e&&typeof e.id==='string'&&typeof e.title==='string'&&/^\d{4}-\d\d-\d\d$/.test(e.date)&&Number.isInteger(e.start)&&e.start>=0&&e.start<1440&&e.start%15===0&&Number.isInteger(e.duration)&&e.duration>=15&&e.duration%15===0&&e.start+e.duration<=1440}function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Could not save to local storage. Export a JSON backup and check browser storage settings.')}}function notify(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('toast').style.display='none',2800)}function setSelected(s){state.selected=s;render();persist()}function render(){const base=monday(state.selected);$('range').textContent=`${fmt(base)} – ${fmt(addDays(base,6))}, ${fromDate(addDays(base,6)).getFullYear()}`;$('datePicker').value=state.selected;$('dayView').classList.toggle('active',state.view==='day');$('weekView').classList.toggle('active',state.view==='week');$('days').innerHTML='';for(let i=0;i<7;i++){const date=addDays(base,i),d=fromDate(date),b=document.createElement('button');b.innerHTML=`${d.toLocaleDateString(undefined,{weekday:'short'})}<strong>${d.getDate()}</strong>`;b.classList.toggle('active',date===state.selected);b.onclick=()=>{state.view='day';setSelected(date)};$('days').appendChild(b)}const shown=state.view==='day'?[state.selected]:Array.from({length:7},(_,i)=>addDays(base,i));const cal=$('calendar');cal.className='calendar '+(state.view==='week'?'week':'day');cal.replaceChildren();const head=document.createElement('div');head.className='day-head';const empty=document.createElement('div');empty.className='time-head';head.append(empty);const hd=document.createElement('div');hd.className='head-days';hd.style.gridTemplateColumns=`repeat(${shown.length},minmax(0,1fr))`;shown.forEach(s=>{const e=document.createElement('div');e.textContent=fromDate(s).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});hd.append(e)});head.append(hd);cal.append(head);const body=document.createElement('div');body.className='body-row';const axis=document.createElement('div');axis.className='time-axis';axis.style.height=DAY+'px';for(let h=0;h<24;h++){const t=document.createElement('div');t.className='hour-label';t.style.top=(h*4*SLOT+9)+'px';t.textContent=minuteLabel(h*60);axis.append(t)}body.append(axis);const area=document.createElement('div');area.className='grid-area';area.style.gridTemplateColumns=`repeat(${shown.length},minmax(0,1fr))`;shown.forEach(date=>{const col=document.createElement('div');col.className='day-column';col.style.height=DAY+'px';col.title='Click a 15-minute slot to add an activity';col.onclick=ev=>{const rect=col.getBoundingClientRect();const y=ev.clientY-rect.top;const start=Math.max(0,Math.min(1425,Math.floor(y/SLOT)*15));openEditor(null,date,start)};const list=state.events.filter(e=>e.date===date).sort((a,b)=>a.start-b.start);list.forEach(e=>{const block=document.createElement('div');block.className='event '+(e.category||'work');block.style.top=(e.start/15*SLOT+2)+'px';block.style.height=(e.duration/15*SLOT-4)+'px';block.innerHTML='';const strong=document.createElement('strong');strong.textContent=e.title;block.append(strong);const time=document.createElement('div');time.className='event-time';time.textContent=`${minuteLabel(e.start)} – ${minuteLabel(e.start+e.duration)}`;block.append(time);block.title=`${e.title}\n${time.textContent}${e.notes?'\n'+e.notes:''}`;if(list.some(other=>other.id!==e.id&&other.start<e.start+e.duration&&e.start<other.start+other.duration))block.classList.add('conflict');block.onclick=ev=>{ev.stopPropagation();openEditor(e)};col.append(block)});area.append(col)});body.append(area);cal.append(body)}function openEditor(e=null,date=state.selected,start=540){editing=e?e.id:null;$('modalTitle').textContent=e?'Edit activity':'New activity';$('title').value=e?.title||'';$('eventDate').value=e?.date||date;$('start').value=String(e?.start??start);$('duration').value=String(e?.duration??30);$('category').value=e?.category||'work';$('notes').value=e?.notes||'';$('delete').classList.toggle('hidden',!e);$('conflictNote').textContent='Activities may overlap; overlapping blocks are outlined in red.';$('modalBackdrop').classList.remove('hidden');$('title').focus()}function closeEditor(){$('modalBackdrop').classList.add('hidden');editing=null}for(let m=0;m<1440;m+=15){const o=document.createElement('option');o.value=m;o.textContent=minuteLabel(m);$('start').append(o)}for(let m=15;m<=1440;m+=15){const o=document.createElement('option');o.value=m;o.textContent=m<60?`${m} minutes`:m%60===0?`${m/60} hour${m===60?'':'s'}`:`${Math.floor(m/60)} hr ${m%60} min`;$('duration').append(o)}$('eventForm').onsubmit=ev=>{ev.preventDefault();const date=$('eventDate').value,start=Number($('start').value),duration=Number($('duration').value),title=$('title').value.trim();if(!title)return;if(start+duration>1440){alert('This version keeps activities within a single calendar day. Choose a shorter duration or create a second activity for the next day.');return}const item={id:editing||id(),date,start,duration,title,category:$('category').value,notes:$('notes').value.trim()};if(editing)state.events=state.events.filter(e=>e.id!==editing);state.events.push(item);state.selected=date;persist();closeEditor();render();notify('Activity saved')};$('delete').onclick=()=>{if(editing&&confirm('Delete this activity?')){state.events=state.events.filter(e=>e.id!==editing);persist();closeEditor();render();notify('Activity deleted')}};$('cancel').onclick=closeEditor();$('modalBackdrop').onclick=e=>{if(e.target===$('modalBackdrop'))closeEditor()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeEditor()});$('prev').onclick=()=>setSelected(addDays(state.selected,-7));$('next').onclick=()=>setSelected(addDays(state.selected,7));$('today').onclick=()=>setSelected(localDate(new Date()));$('datePicker').onchange=e=>{if(e.target.value)setSelected(e.target.value)};$('dayView').onclick=()=>{state.view='day';render();persist()};$('weekView').onclick=()=>{state.view='week';render();persist()};$('add').onclick=()=>openEditor();$('print').onclick=()=>window.print();$('export').onclick=()=>{const blob=new Blob([JSON.stringify({app:'Seven Day Planner',version:1,exportedAt:new Date().toISOString(),events:state.events},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`seven-day-planner-backup-${localDate(new Date())}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Backup exported')};$('import').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(!obj||!Array.isArray(obj.events)||!obj.events.every(validEvent))throw Error('Invalid planner backup format');if(!confirm(`Replace your current ${state.events.length} activities with ${obj.events.length} imported activities? Export a backup first if you want to keep the current data.`))return;state.events=obj.events;persist();render();notify('Backup imported')}catch(err){alert('Import failed: '+err.message)}finally{e.target.value=''}};render();setTimeout(()=>{const sc=$('scroll');sc.scrollTop=7*4*SLOT},50)})();
</script></body></html>
